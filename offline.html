<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Не удалось открыть страницу · Анастасия Гоева</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style>@font-face{font-family:Editorial;src:url(/fonts/CormorantGaramond.ttf);font-display:swap}@font-face{font-family:Golos;src:url(/fonts/GolosText.ttf);font-display:swap}:root{color-scheme:light;--paper:#faf7ee;--ink:#263f32;--muted:#50634f;--line:#c4c9b8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Golos,system-ui,sans-serif}a{color:inherit}a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:4px}.error-wrap{width:min(1060px,calc(100% - 40px));margin:auto}.error-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.mark{display:grid;place-items:center;border-radius:50%;width:52px;height:52px;background:#344c3b;color:#faf7ee;font-size:12px;font-weight:800}.name{font-family:Editorial,Georgia,serif;font-size:24px}.lang{display:flex;gap:4px}.lang button{min-width:44px;min-height:44px;border:1px solid transparent;border-radius:50%;background:transparent;color:inherit;cursor:pointer}.lang button[aria-pressed=true]{border-color:var(--line);background:#ede9db}main{min-height:calc(100svh - 155px);display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:45px 0}.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font:500 clamp(48px,6vw,84px)/1.02 Editorial,Georgia,serif;letter-spacing:-.035em;margin:18px 0 22px}p{max-width:480px;color:var(--muted);margin:0 0 26px}.actions{display:flex;flex-wrap:wrap;gap:12px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 23px;border:1px solid #344c3b;border-radius:999px;background:#344c3b;color:#faf7ee;font:600 14px/1.4 Golos,system-ui,sans-serif;text-decoration:none;cursor:pointer}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.art{width:100%;height:auto;fill:none;stroke:#9f655b;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.art .soft{stroke:#5b7050}.art text{fill:var(--ink);stroke:none;font-family:Editorial,Georgia,serif;font-size:120px}.foot{border-top:1px solid var(--line);padding:14px 0 20px;font-size:12px;color:var(--muted)}@media(max-width:650px){main{grid-template-columns:1fr;gap:5px;padding:32px 0 25px;min-height:0}.art{max-height:240px;grid-row:1}.name{font-size:21px}.mark{width:44px;height:44px;font-size:10px}.error-top{padding:14px 0}h1{font-size:48px}.actions{flex-direction:column}.button{width:100%}.foot{text-align:center;margin-top:15px}}</style></head><body><div class="error-wrap"><header class="error-top"><a class="brand" id="brand-link" href="/"><span class="mark">OGOGO</span><span class="name" id="name">Анастасия Гоева</span></a><div class="lang" aria-label="Language"><button data-lang="ru" aria-pressed="true">РУ</button><button data-lang="en" aria-pressed="false">EN</button></div></header><main><div><div class="eyebrow" id="code">Нет соединения</div><h1 id="title">Не удалось открыть страницу</h1><p id="desc">Проверьте подключение к интернету и попробуйте ещё раз. Как только связь появится, вы сможете вернуться на сайт.</p><div class="actions"><button class="button" id="retry" type="button">Попробовать ещё раз</button><a class="button secondary" id="home" href="/">На главную</a></div></div><svg class="art" viewBox="0 0 500 380" aria-hidden="true"><path d="M0 220 C120 145 165 295 250 251 C332 208 285 102 210 153 C141 199 309 295 362 205 C415 115 280 89 281 167 C282 240 418 286 500 199"/><path class="soft" d="M0 267 C103 277 126 210 197 226 C287 247 316 326 407 297 C443 285 474 265 500 270"/><path d="M172 106 C182 55 270 45 292 93 M195 110 Q230 78 267 108 M223 127 Q232 119 241 127 M231 148 l2 0 M315 73 l-115 112"/></svg></main><footer class="foot" id="foot">Клинический и семейный психолог</footer></div><script>const copy={"ru": {"title": "Не удалось открыть страницу", "code": "Нет соединения", "desc": "Проверьте подключение к интернету и попробуйте ещё раз. Как только связь появится, вы сможете вернуться на сайт.", "home": "На главную", "retry": "Попробовать ещё раз", "contact": "Написать мне", "name": "Анастасия Гоева", "foot": "Клинический и семейный психолог"}, "en": {"title": "We couldn’t open this page", "code": "Connection unavailable", "desc": "Check your internet connection and try again. You can return to the website as soon as you’re back online.", "home": "Back to the homepage", "retry": "Try again", "contact": "Get in touch", "name": "Anastasia Goeva", "foot": "Clinical and family psychologist"}};let lang='ru';try{lang=localStorage.getItem('site-language')==='en'?'en':'ru'}catch{}if(location.pathname.startsWith('/en'))lang='en';function setLanguage(l){lang=l;document.documentElement.lang=l;for(const [id,text]of Object.entries(copy[l])){const e=document.getElementById(id);if(e)e.textContent=text}document.title=copy[l].title+' · Anastasia Goeva';document.getElementById('home').href=l==='en'?'/en.html':'/';document.getElementById('brand-link').href=l==='en'?'/en.html':'/';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));try{localStorage.setItem('site-language',l)}catch{}}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));document.getElementById('retry')?.addEventListener('click',()=>location.reload());setLanguage(lang);</script></body></html>
